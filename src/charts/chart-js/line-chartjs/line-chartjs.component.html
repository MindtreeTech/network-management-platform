<div class="content-body default-height">
    <div class="container-fluid default-apex-cl">
         <!-- Conten Head -->

         <app-content-head [head_title]="contantHead"></app-content-head>
        
         <!-- End Conten Head -->
        <!-- row -->
        <div class="row">
            <div class="col-xl-6 col-xxl-12">
                <div class="card">
                    <div class="card-header d-block">
                        <h4 class="card-title">Basic Chart</h4>
                    </div>
                    <div class="card-body">
                        
                        <app-basic-chart></app-basic-chart>
                        
                    </div>
                </div>
            </div>
            <div class="col-xl-6 col-xxl-12">
                <div class="card">
                    <div class="card-header d-block">
                        <h4 class="card-title">Interpolation Chart</h4>
                    </div>
                    <div class="card-body">
                        <app-interpolation-chart></app-interpolation-chart>
                    </div>
                </div>
            </div>
            <div class="col-xl-6 col-xxl-12">
                <div class="card">
                    <div class="card-header d-block">
                        <h4 class="card-title">Multi Axis Line Chart</h4>
                    </div>
                    <div class="card-body">
                        
                        <app-multi-axis-line-chart></app-multi-axis-line-chart>
                        
                    </div>
                </div>
            </div>
            <div class="col-xl-6 col-xxl-12">
                <div class="card">
                    <div class="card-header d-block">
                        <h4 class="card-title">Point Styling Chart</h4>
                    </div>
                    <div class="card-body">
                        
                        <app-point-chart></app-point-chart>
                     
                    </div>
                </div>
            </div>
            <div class="col-xl-6 col-xxl-12">
                <div class="card">
                    <div class="card-header d-block">
                        <h4 class="card-title">Line Styling Chart</h4>
                    </div>
                    <div class="card-body">
                        
                        <app-line-styling></app-line-styling>
                        
                    </div>
                </div>
            </div>
            <div class="col-xl-6 col-xxl-12">
                <div class="card">
                    <div class="card-header d-block">
                        <h4 class="card-title">Stepped Line Charts</h4>
                    </div>
                    <div class="card-body">
                        
                        <app-stepped-chart></app-stepped-chart>
                        
                    </div>
                </div>
            </div>
        </div> 
    </div>
</div>
