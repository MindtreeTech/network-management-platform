	  <script type="text/javascript">
		document.onkeydown = fkey;
		var wasPressed = false;
	
		function fkey(e){
			e = e || window.event;
			if (e.keyCode == 116) {
				window.dispatchEvent(new Event('saveUserData-event'));
				localStorage.setItem("time", (new Date()).toISOString());
			}
		}
	
		addEventListener('unload', (event) => {
			window.dispatchEvent(new Event('saveUserData-event')); 
			localStorage.setItem("admin_time", (new Date()).toISOString());
		});
	</script>
