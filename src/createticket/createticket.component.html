
<div class="content-body default-height">
    <!-- row -->
    <div class="container-fluid">
        <app-content-head [head_title]="contantHead"></app-content-head>
        <app-content-desh-head  [head_title]="contantHead"> </app-content-desh-head>
        <ng-template #messageModal let-modal>
            <div class="modal-header">
                <h5 class="modal-title">{{messageHeader}}</h5>
                <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
            </div>
            <div class="modal-body data-picker-costem">
                <form>
                    <div class="mb-3">
                        <label class="text-black font-w500">{{message}}</label>
                    </div>
                    <div class="form-group">
                        <button type="button" class="btn btn-primary light" style="margin-left: 10px;" (click)="onOk(modal)">OK</button>
                    </div>
                </form>
            </div>
        </ng-template>
        <div #screenSelectionDiv class="row" *ngIf="currentPage==0">
            <div class="col-lg-12">
                <div class="data-picker-costem">
                    <form>
                        <div class="row">
                            <div class="form-group mb-3 col-md-6">
                                <label class="text-black font-w500">Store</label>
                                <select class="form-select wide mb-3" [(ngModel)]="storeName" [ngModelOptions]="{standalone: true}" (change)="onStoreSelected()">
                                    <option *ngFor="let name of storeNames" [value]="name">{{name}}</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group mb-3 col-md-6">
                                <label class="text-black font-w500">Screen Type</label>
                                <select class="form-select wide mb-3" name="screenType" [(ngModel)]="screenType" [ngModelOptions]="{standalone: true}" (change)="onScreenTypeChanged()">
                                    <option *ngFor="let type of screenTypes" [value]="type">{{type}}</option>
                                </select>
                            </div>
                        </div>
                        <div *ngIf="screenType != ''" class="row">
                            <div class="col-md-12">
                                <label class="text-black font-w500">Screen [Click on any screen panel]</label><br>
                                <div class="row">
                                    <div class="col-md-6">
                                         <div *ngIf="screenType=='BWS' || screenType=='EPU 1' || screenType=='EPU 2'" id="screenLayout" class="form-control"  style="width:500px; height:500px; border:2px solid; color:0x000055;"></div>
                                    </div>
                                    <div class="col-md-1">
                                    </div>
                                    <div class="col-md-5">
                                        <div class="row"><label class="text-black font-w500">Selected Screen</label></div>
                                        <div class="row">
                                            <img *ngIf="screenType!='BWS' && screenType!='EPU 1' && screenType!='EPU 2' && screenType!=''" [src]="screenImageSrc" style="width:200px; height:200px; border:2px solid; color:0x000055;" (click)="openScreenImage()">
                                            <img *ngIf="screenType=='BWS' || screenType=='EPU 1' || screenType=='EPU 2'" id="screenLayout" [src]="screenImageSrc" style="width:200px; height:200px; border:2px solid; color:0x000055;" (click)="openScreenImage()">
                                        </div>
                                    </div>    
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group">
                                <button type="button" class="btn btn-primary light mt-2" (click)="onScreenSelected();">Next</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div #createTicketDiv class="row" *ngIf="currentPage==1">
            <div class="col-lg-12">
                <div class="data-picker-costem">
                    <form>
                        <div class="mb-3">
                            <label class="text-black font-w500">Title</label>
                            <input type="text" class="form-control" [(ngModel)]="title" [ngModelOptions]="{standalone: true}">
                        </div>
                        <div class="mb-3">
                            <label class="text-black font-w500">Description</label>
                            <textarea rows="5" class="form-control" [(ngModel)]="description" [ngModelOptions]="{standalone: true}"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="file">Attach Images</label>
                            <input #file type="file" class="form-control" id="images" accept="image/*" capture (change)="handleFileInput($event)" placeholder="Upload Image">
                        </div>
                        <div class="form-group">
                            <div class="row">
                                <div class="text-center">
                                    <button type="button" class="btn btn-primary light" (click)="onBack();">Back</button>
                                    <button type="button" class="btn btn-primary light ms-5" (click)="onCreate();">Create</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <ng-template #imageModal let-modal>
        <div class="modal-content" style="width:auto">
            <div class="modal-header">
                <h5 class="modal-title">{{imageModalTitle}}</h5>
                <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
            </div>
            <div class="modal-body data-picker-costem">
                <form>
                    <div class="mb-3">
                        <img [src]="imageModalSrc">
                    </div>
                    <div class="form-group">
                        <button type="button" class="btn btn-primary light" style="margin-left: 10px;" (click)="modal.dismiss();">OK</button>
                    </div>
                </form>
            </div>
        </div>
    </ng-template>
</div>
